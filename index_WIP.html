<!DOCTYPE html>
<html lang="fr">
<head>

    <link rel="icon" href="icon_site.png" />

</head>
<body>

    <header class="top-bar">

        <section class="panel panel--wide">
            <div class="panel__heading panel__heading--centered">

                    <div class="panel__eyebrow">Maintenance</div>
